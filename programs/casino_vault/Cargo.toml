[package]
name = "casino_vault"
version = "0.1.1"
description = "Pooled SOL custody program: holds player funds for a casino backend, with admin-approved withdrawals."
edition = "2021"
license = "MIT"
# rustc version shipped with Solana platform-tools v1.48 (Agave 2.3.x). Kept in
# sync so the MSRV-aware resolver never selects a crate the SBF toolchain
# cannot build.
rust-version = "1.84.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "casino_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.32.1"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("solana"))'] }
