name: Feature request
description: Suggest a change or addition.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: For on-chain changes, note any effect on account layout, PDA seeds, or existing error codes.
