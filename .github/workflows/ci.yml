name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI never needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLANA_VERSION: 2.3.13
  ANCHOR_VERSION: 0.32.1
  NODE_VERSION: 22
  # Dependabot writes package-lock.json with npm 11, whose lockfiles npm 10
  # (Node 22's default) rejects in `npm ci`. Use the same major here.
  NPM_VERSION: 11.21.1
  RUST_VERSION: 1.89.0

jobs:
  rust:
    name: Rust (clippy + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, pinned
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: test
        run: cargo test --locked

  anchor:
    name: Anchor (build + integration tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, pinned
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Solana + Anchor CLIs
        id: cli-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/solana
            ~/.cargo/bin/anchor
          key: cli-solana-${{ env.SOLANA_VERSION }}-anchor-${{ env.ANCHOR_VERSION }}-${{ runner.os }}

      - name: Install Solana CLI
        if: steps.cli-cache.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"

      # anchor-cli depends on hidapi, whose build script needs the libudev
      # headers. GitHub-hosted Ubuntu runners do not ship them, and without them
      # the install fails with exit code 101 ("Unable to find libudev").
      - name: Install system packages for the Anchor CLI
        if: steps.cli-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev pkg-config

      - name: Install Anchor CLI
        if: steps.cli-cache.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/coral-xyz/anchor --tag "v${ANCHOR_VERSION}" anchor-cli --locked

      - name: Add CLIs to PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Versions
        run: |
          solana --version
          anchor --version

      - name: Use npm ${{ env.NPM_VERSION }}
        run: npm install -g npm@${NPM_VERSION} && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Provider wallet for localnet
        run: solana-keygen new -o wallet.json --no-bip39-passphrase --silent --force

      - name: anchor build
        run: anchor build

      # casino_fair is a standalone crate that `anchor build` skips; its
      # committed Cargo.lock only builds on platform-tools v1.48 (rustc 1.84.1).
      - name: casino_fair SBF build
        run: cargo build-sbf --manifest-path reference/casino_fair/Cargo.toml --tools-version v1.48 -- --locked

      # The SDK holds the only committed IDL copy; the frontend imports it
      # from the published @x2c-fun/casinovault-sdk package.
      - name: Committed IDL matches build output
        run: |
          diff <(jq -S . target/idl/casino_vault.json) \
               <(jq -S . packages/sdk/src/idl/casino_vault.json)
          diff target/types/casino_vault.ts packages/sdk/src/idl/casino_vault.ts

      - name: Typecheck scripts and tests
        run: npx tsc --noEmit -p .

      - name: Prettier
        run: npm run lint

      - name: anchor test
        run: anchor test --skip-build

  frontend:
    name: Frontend (tsc + eslint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: casinovault-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: casinovault-frontend/package-lock.json
      - name: Use npm ${{ env.NPM_VERSION }}
        run: npm install -g npm@${NPM_VERSION} && npm --version
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx next build --webpack
      - name: Production dependency audit (critical only)
        run: npm audit --omit=dev --audit-level=critical

  packages:
    name: Packages (SDK + backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            packages/sdk/package-lock.json
            packages/backend/package-lock.json
      - name: Use npm ${{ env.NPM_VERSION }}
        run: npm install -g npm@${NPM_VERSION} && npm --version

      # The backend depends on the SDK by path, so the SDK is built first.
      - name: SDK
        working-directory: packages/sdk
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test
          npm run smoke
          npm audit --omit=dev --audit-level=critical
      # The published tarball must hold exactly package.json, README.md,
      # LICENSE and dist/*. `npm pack --dry-run` alone only lists the files.
      - name: SDK package contents
        working-directory: packages/sdk
        run: |
          npm pack --dry-run --json | node -e '
            const files = JSON.parse(require("fs").readFileSync(0, "utf8"))[0].files.map((f) => f.path).sort();
            const required = ["package.json", "README.md", "LICENSE"];
            const extra = files.filter((p) => !required.includes(p) && !p.startsWith("dist/"));
            const missing = required.filter((p) => !files.includes(p));
            for (const p of files) console.log(p);
            if (extra.length || missing.length || !files.some((p) => p.startsWith("dist/"))) {
              console.error("unexpected package contents", { extra, missing });
              process.exit(1);
            }
          '
      - name: Backend
        working-directory: packages/backend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm audit --omit=dev --audit-level=critical

  casino_fair:
    name: casino_fair (clippy + host tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reference/casino_fair
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, pinned
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: reference/casino_fair
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: clippy (ephemeral + test-queue features)
        run: cargo clippy --locked --all-targets --features ephemeral,test-queue -- -D warnings
      - name: test
        run: cargo test --locked
