[workspace]
# `casino_fair` (the MagicBlock-VRF fairness reference) lives in `reference/`,
# not `programs/`, and is not a workspace member. Its dependency tree only
# builds for SBF on the pinned platform-tools with its own committed
# `reference/casino_fair/Cargo.lock`, so it keeps that lock instead of sharing
# this one, and `anchor build` (which builds everything in `programs/`) stays
# limited to the vault. See docs/fairness.md for building and testing it.
members = ["programs/casino_vault", "programs/cpi_probe"]
exclude = ["reference/casino_fair"]
# Anchor 0.32's manifest parser only understands resolver 1 and 2, so the
# workspace stays on 2 and `Cargo.lock` is the pin instead.
#
# Solana platform-tools ships Cargo 1.84, which cannot parse lockfile version 4
# (written by host Cargo ≥1.84) and cannot compile edition-2024 crates. Always
# regenerate with the MSRV-aware resolver, then force version = 3:
#
#   rm -f Cargo.lock
#   cargo +nightly generate-lockfile -Zmsrv-policy \
#     --config 'resolver.incompatible-rust-versions="fallback"'
#   # then set the third line of Cargo.lock from `version = 4` to `version = 3`
#
# Commit Cargo.lock. Do not let a plain `cargo update` on a new host rewrite it.
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
