[toolchain]
anchor_version = "0.32.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
casino_vault = "DdpfHbMEYWqZM9yzPvyT45qLPfiLP6yKaPNTgqx7navY"

[programs.devnet]
casino_vault = "DdpfHbMEYWqZM9yzPvyT45qLPfiLP6yKaPNTgqx7navY"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "wallet.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 15000
shutdown_wait = 2000

[test.validator]
bind_address = "0.0.0.0"
ledger = ".anchor/test-ledger"
rpc_port = 8899
