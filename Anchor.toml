[toolchain]
anchor_version = "0.32.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
casino_vault = "DdpfHbMEYWqZM9yzPvyT45qLPfiLP6yKaPNTgqx7navY"
# Test fixture only (forwards vault calls through CPI); never deployed.
cpi_probe = "39Uobb8yLSbbXqx6izPWWCu6v9F9cRQduBAYSbPFEdMt"

[programs.devnet]
casino_vault = "DdpfHbMEYWqZM9yzPvyT45qLPfiLP6yKaPNTgqx7navY"

[provider]
cluster = "localnet"
wallet = "wallet.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 15000
shutdown_wait = 2000

[test.validator]
bind_address = "127.0.0.1"
ledger = ".anchor/test-ledger"
rpc_port = 8899
