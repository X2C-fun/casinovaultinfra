[package]
name = "casino_fair"
version = "0.1.0"
description = "Provably-fair coin-flip reference program: verifiable randomness via MagicBlock VRF with an authenticated settlement callback."
edition = "2021"
license = "MIT"
# rustc version shipped with Solana platform-tools v1.48 (Agave 2.3.x). Kept in
# sync with the vault so the MSRV-aware resolver never selects a crate the SBF
# toolchain cannot build.
rust-version = "1.84.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "casino_fair"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["event-cpi"] }
# MagicBlock Ephemeral Rollups SDK. The `vrf` feature re-exports the VRF request
# builder, the `#[vrf]` / `#[vrf_callback]` macros and the oracle-queue consts,
# so no direct `ephemeral-vrf-sdk` dependency is needed. The feature MUST be
# `anchor-compat`, NOT `anchor`: `anchor` targets Anchor 1.x, `anchor-compat`
# targets Anchor >=0.28,<1.0, and this workspace is pinned to Anchor 0.32.1.
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor-compat", "vrf"] }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("solana"))'] }
